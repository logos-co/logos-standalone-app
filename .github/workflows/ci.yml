name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
    # what this job builds; logos-co.cachix.org stays as a read-only fallback.
    - name: Set up Nix and the Logos cache
      uses: logos-co/setup-nix-cache-action@v1
      with:
        attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
        attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
        extra-nix-config: |
          extra-substituters = https://logos-co.cachix.org
          extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

    - name: Build
      run: nix build --print-build-logs

    - name: Smoke test
      run: nix build '.#checks.${{ matrix.arch }}.smoke-test' --print-build-logs

    - name: Integration test
      run: nix build 'path:./tests#checks.${{ matrix.arch }}.integration-test' --override-input logos-standalone-app path:. --print-build-logs

    # The one control that mechanically enforces the one-runtime invariant:
    # each of TokenManager / StoreRegistry / LogosAPI / LogosAPIClient is
    # DEFINED by exactly one image among those sharing a process. Until this
    # step existed the gate was exposed in `checks` and built by NOTHING -- this
    # workflow names smoke-test and integration-test specifically, `nix flake
    # check` runs nowhere here, and `ws test` builds one check per repo.
    #
    # The negative control ships with it, always: it plants a REAL duplicate
    # definer where an in-process consumer goes and asserts the gate REJECTS
    # that tree. Without it an assertion that has never been seen to fail is
    # indistinguishable from a broken one.
    - name: One-runtime symbol gate
      run: |
        nix build '.#checks.${{ matrix.arch }}.symbol-gate' --print-build-logs
        nix build '.#checks.${{ matrix.arch }}.symbol-gate-negative' --print-build-logs

    # The gate above reads what we SHIP -- one liblogos_protocol in $out/lib --
    # which stays true while qt-host was compiled against a second one that only
    # the closure names. That is the gap that heap-corrupts every getClient().
    # The rule lives in logos-protocol, where the ABI is owned; run it from the
    # revision we lock, not master, so the check and the build agree.
    - name: qt-host/protocol pairing
      run: |
        nix build ".#packages.${{ matrix.arch }}.abi-subject" -o result-abi-subject --print-build-logs
        # Resolve the ROOT logos-protocol edge. The flat node of that name
        # belongs to whichever edge claimed it first, which is not ours.
        rev=$(nix flake metadata --json |
          jq -r '.locks as $l | $l.nodes[$l.nodes[$l.root].inputs["logos-protocol"]].locked.rev')
        nix run "github:logos-co/logos-protocol/$rev#abi-closure-check" -- ./result-abi-subject
